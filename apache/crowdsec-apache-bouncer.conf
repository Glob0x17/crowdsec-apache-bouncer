# Apache httpd configuration for crowdsec-apache-bouncer (requires mod_lua and lua-socket).
#   Debian/Ubuntu: a2enmod lua && a2enconf crowdsec-apache-bouncer

<IfModule lua_module>
    # One Lua state per thread: the script and its configuration cache are loaded once, not on every request.
    LuaScope thread

    # "early" runs the check before the other access checkers (Require, auth...) of the same context.
    LuaHookAccessChecker /usr/share/crowdsec-apache-bouncer/crowdsec-apache-bouncer.lua check early
</IfModule>
