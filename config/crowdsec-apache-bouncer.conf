# crowdsec-apache-bouncer configuration (KEY=VALUE, re-read every 60 seconds).

# Set to false to let every request through without asking CrowdSec.
ENABLED=true

# CrowdSec AppSec component (acquisition "source: appsec", listen_addr).
APPSEC_URL=http://127.0.0.1:7422/

# Bouncer API key: cscli bouncers add apache-<host>
API_KEY=

# Timeout of each network operation (connect, send, receive) of the AppSec check, in milliseconds.
APPSEC_TIMEOUT_MS=500

# passthrough: let the request through when the check fails (timeout, unreachable, rejected key).
# deny: block it instead.
APPSEC_FAILURE_ACTION=passthrough

# Force the status of blocked requests (default: the one returned by CrowdSec, usually 403).
BLOCK_STATUS=

# Comma-separated URI prefixes never sent to CrowdSec (e.g. /server-status,/healthz).
EXCLUDE_LOCATION=
